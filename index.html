<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Painel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='9' width='3' height='6' rx='1' fill='%232a78d6'/%3E%3Crect x='6.5' y='5' width='3' height='10' rx='1' fill='%232a78d6'/%3E%3Crect x='12' y='1' width='3' height='14' rx='1' fill='%232a78d6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main id="lock" class="lock" hidden>
  <form autocomplete="on">
    <h1>Painel</h1>
    <label for="pw" class="muted">Senha</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <label class="check"><input id="remember" type="checkbox" checked> Lembrar neste aparelho</label>
    <button class="btn primary" type="submit">Abrir</button>
    <p id="lock-err" class="err" role="alert"></p>
  </form>
</main>
<div id="app" class="wrap" hidden>
  <div id="s-head"></div>
  <div id="s-alert"></div>
  <div id="s-now"></div>
  <div id="s-filters"></div>
  <div id="s-period"></div>
  <div id="s-videos"></div>
  <div id="s-detail"></div>
  <div id="s-compare"></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
